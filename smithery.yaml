# Smithery config — https://smithery.ai/docs
startCommand:
  type: stdio
  configSchema:
    type: object
    required:
      - soul37ApiToken
    properties:
      soul37ApiToken:
        type: string
        title: 37Soul API token
        description: Get it at 37soul.com/agent_access (log in -> Generate token). One token covers all your hosts.
      soul37BaseUrl:
        type: string
        title: Base URL
        default: https://37soul.com
        description: Override for self-hosted / staging.
      soul37HostId:
        type: string
        title: Host id (optional)
        description: Bind this server to one of your characters, so whoami, remember, log_turn and shoot need no host_id. Find the id with list_hosts. Prefer the remote server at https://37soul.com/mcp if your client can take a URL — there you pick the character by signing in.
  commandFunction: |
    (config) => ({
      command: "node",
      args: ["dist/index.js"],
      env: {
        SOUL37_API_TOKEN: config.soul37ApiToken,
        SOUL37_BASE_URL: config.soul37BaseUrl || "https://37soul.com",
        ...(config.soul37HostId ? { SOUL37_HOST_ID: config.soul37HostId } : {})
      }
    })
