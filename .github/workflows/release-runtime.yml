name: Verify runtime

# Builds and verifies the self-contained installer runtime only. There is NO
# upload-to-Release job here: publishing is a separate, explicitly-authorized step
# (the tarball + .sha256 + VERSION stay local build artifacts). Trigger: push a tag
# vX.Y.Z that matches package.json, or run it manually from the Actions tab.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      service_acceptance:
        description: Run real clean OS default installer lifecycle (hosted VMs only)
        type: boolean
        default: true
      public_release:
        description: Verify published latest with literal public curl (after release only)
        type: boolean
        default: false
      baseline_ref:
        description: Runtime baseline full 40-character commit SHA (not abbreviated)
        default: '632f60695d4d65583d17c45db663a1c8eabef672'
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 24]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Tag must match package.json
        if: github.event_name == 'push'
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json ${version}" >&2
            exit 1
          fi

      # Pack first so the test suite actually validates the release artifact.
      - run: ./scripts/pack-runtime.sh

      - run: npm test
        env:
          SOUL37_REQUIRE_PACKED_RELEASE: "1"

      - name: Verify tarball layout (root, bundle, bridges, no native modules, digest)
        run: |
          set -euo pipefail
          tar -tzf release/37soul-runtime.tgz > /tmp/runtime-files.txt
          grep -q '^37soul/package.json$' /tmp/runtime-files.txt
          grep -q '^37soul/dist/bundle/cli.js$' /tmp/runtime-files.txt
          grep -q '^37soul/dist/bundle/index.js$' /tmp/runtime-files.txt
          grep -q '^37soul/dist/adapters/plugins/opencode.js$' /tmp/runtime-files.txt
          grep -q '^37soul/src/adapters/plugins/hermes.py$' /tmp/runtime-files.txt
          # Every entry is under the 37soul/ root (no absolute/out-of-tree member).
          if grep -v '^37soul/' /tmp/runtime-files.txt | grep -q .; then
            echo "tarball member outside 37soul/ root" >&2
            exit 1
          fi
          if tar -tzf release/37soul-runtime.tgz | grep -E '\.(node|wasm|so|dylib)$' | grep -q .; then
            echo "native module/WASM found in runtime" >&2
            exit 1
          fi
          recorded="$(awk '{print $1}' release/37soul-runtime.tgz.sha256)"
          actual="$(sha256sum release/37soul-runtime.tgz | awk '{print $1}')"
          test "$recorded" = "$actual"
          test "$(cat release/VERSION)" = "$(node -p 'require("./package.json").version')"

  service-pack:
    if: github.event_name == 'workflow_dispatch' && inputs.service_acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          path: candidate
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.baseline_ref }}
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare exact release evidence for both operating systems
        env:
          PUBLIC_RELEASE: ${{ inputs.public_release }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p service-inputs
          for repo in candidate baseline; do
            git -C "$repo" rev-parse HEAD > "service-inputs/$repo-sha.txt"
          done
          (cd baseline && npm ci && ./scripts/pack-runtime.sh)
          mkdir -p service-inputs/baseline service-inputs/candidate
          cp -R baseline/release service-inputs/baseline/
          if [[ "$PUBLIC_RELEASE" == "true" ]]; then
            node candidate/test/service/public-release.mjs service-inputs/candidate/release candidate/package.json
          else
            (cd candidate && npm ci && ./scripts/pack-runtime.sh)
            cp -R candidate/release service-inputs/candidate/
          fi
          cp candidate/test/service/fixtures/install.sh service-inputs/install.sh
          cp candidate/test/service/fixtures/provenance.json service-inputs/installer-provenance.json
          node --test candidate/test/service/acceptance.test.mjs
          node --input-type=module -e 'import fs from "node:fs"; import {createHash} from "node:crypto"; import assert from "node:assert/strict"; const p=JSON.parse(fs.readFileSync("service-inputs/installer-provenance.json")); assert.equal(createHash("sha256").update(fs.readFileSync("service-inputs/install.sh")).digest("hex"), p.sha256)'
      - uses: actions/upload-artifact@v4
        with:
          name: service-runtime-inputs
          path: service-inputs/
          retention-days: 14
          if-no-files-found: error

  native-service:
    needs: service-pack
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: service-runtime-inputs
          path: service-inputs
      - name: Establish real Linux user systemd session
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
          XDG_RUNTIME_DIR="/run/user/$(id -u)" DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$(id -u)/bus" systemctl --user show-environment
      - name: Default HTTP installer and native service lifecycle
        id: acceptance
        env:
          PUBLIC_RELEASE: ${{ inputs.public_release }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p service-evidence
          extra=()
          if [[ "$PUBLIC_RELEASE" == "true" ]]; then extra+=(--public-release); fi
          node test/service/acceptance.mjs service-inputs/baseline/release service-inputs/candidate/release service-inputs/install.sh service-evidence "${extra[@]}" 2>&1 | tee service-evidence/harness.log
      - name: Record job result (absence of PASS is never acceptance)
        if: always()
        env:
          ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
        shell: bash
        run: |
          mkdir -p service-evidence
          node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync("service-evidence/result.json", JSON.stringify({os:process.platform,outcome:process.env.ACCEPTANCE_OUTCOME,pass:process.env.ACCEPTANCE_OUTCOME === "success" && fs.existsSync("service-evidence/PASS.json")},null,2))'
          cp service-inputs/*-sha.txt service-inputs/installer-provenance.json service-evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: service-acceptance-${{ matrix.os }}
          path: service-evidence/
          retention-days: 14
