name: Sync MCP Registry

# Keeps the official MCP Registry entry io.github.Qumge/37soul-mcp in step with
# server.json. Since 2026-10-06 the listing is the hosted server only
# (https://37soul.com/mcp, OAuth or a Bearer token) — the npm stdio package is no
# longer published or listed — so server.json is the single source of truth.
#
# Written as a RECONCILIATION job: a no-op when the registry already serves
# server.json's version. The registry namespace is case-sensitive and must match
# the GitHub org exactly (Qumge, not qumge): GitHub OIDC grants io.github.Qumge/*.

on:
  push:
    branches: [main]
    paths:
      - server.json
      - .github/workflows/sync-mcp-registry.yml
  schedule:
    - cron: "43 6 * * 2"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run every step including OIDC login, but stop before publishing"
        type: boolean
        default: false

concurrency:
  group: sync-mcp-registry
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # mcp-publisher login github-oidc
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Read server.json
        id: local
        run: |
          set -euo pipefail
          echo "name=$(jq -r .name server.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version server.json)" >> "$GITHUB_OUTPUT"

      - name: Read the version the MCP Registry serves as latest
        id: registry
        env:
          NAME: ${{ steps.local.outputs.name }}
        run: |
          set -euo pipefail
          version=$(curl -fsSL "https://registry.modelcontextprotocol.io/v0/servers?search=37soul&limit=100" \
            | jq -r --arg n "$NAME" '[.servers[]
                      | select(.server.name == $n)
                      | select(._meta["io.modelcontextprotocol.registry/official"].isLatest == true)
                      | .server.version][0] // "none"')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "registry latest for $NAME: $version"

      - name: Decide whether a sync is needed
        id: decide
        env:
          LOCAL: ${{ steps.local.outputs.version }}
          REG: ${{ steps.registry.outputs.version }}
          DRY: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$LOCAL" = "$REG" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "In sync at $LOCAL — nothing to publish."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Registry is on $REG but server.json says $LOCAL — syncing."
          fi
          if [ "$LOCAL" != "$REG" ] || [ "$DRY" = "true" ]; then
            echo "check_plumbing=true" >> "$GITHUB_OUTPUT"
          else
            echo "check_plumbing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install mcp-publisher
        if: steps.decide.outputs.check_plumbing == 'true'
        run: |
          set -euo pipefail
          # Deliberately `latest`, not pinned: the registry has migrated its
          # server.json schema before and an older publisher 422s against it.
          os=$(uname -s | tr '[:upper:]' '[:lower:]')
          arch=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_${os}_${arch}.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version

      - name: Validate server.json against the live registry schema
        if: steps.decide.outputs.check_plumbing == 'true'
        run: ./mcp-publisher validate

      - name: Authenticate via GitHub OIDC
        if: steps.decide.outputs.check_plumbing == 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        if: steps.decide.outputs.needed == 'true' && inputs.dry_run != true
        run: ./mcp-publisher publish

      - name: Confirm the registry now serves server.json's version
        if: steps.decide.outputs.needed == 'true' && inputs.dry_run != true
        env:
          NAME: ${{ steps.local.outputs.name }}
          LOCAL: ${{ steps.local.outputs.version }}
        run: |
          set -euo pipefail
          # Read back rather than trusting the publish exit code. Indexing can take
          # over a minute, so wait longer than the old 5 x 6s.
          for attempt in $(seq 1 10); do
            live=$(curl -fsSL "https://registry.modelcontextprotocol.io/v0/servers?search=37soul&limit=100" \
              | jq -r --arg n "$NAME" '[.servers[]
                        | select(.server.name == $n)
                        | select(._meta["io.modelcontextprotocol.registry/official"].isLatest == true)
                        | .server.version][0] // "none"')
            if [ "$live" = "$LOCAL" ]; then
              echo "::notice::Registry now serves $NAME $live."
              exit 0
            fi
            echo "attempt $attempt: registry still on $live, waiting…"
            sleep 15
          done
          echo "::error::published, but the registry still does not serve $LOCAL"
          exit 1

      - name: Dry run stopped before publishing
        if: inputs.dry_run == true
        run: |
          echo "::notice::Dry run — OIDC login succeeded and server.json validated. Skipped publish."
